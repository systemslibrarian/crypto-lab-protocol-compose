name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  # Cancelling a main/dispatch run can strand a green commit without a Pages
  # deployment. Only superseded PR validation is safe to stop early.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test --if-present
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  configure-pages:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    steps:
      # This privileged job executes no repository code or package lifecycle script.
      - uses: actions/configure-pages@v6

  deploy:
    if: github.event_name != 'pull_request'
    needs: configure-pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  # Dependabot only. Runs after the gate above, so a bump can only merge itself
  # if this lab's own tests, build and axe/e2e run went green on the PR.
  # Majors are deliberately excluded -- the 2026-08-18 batch had to hold back 109
  # bumps and they were overwhelmingly majors (@noble v2 dropped export subpaths,
  # TypeScript 7, vitest 4), so those still want a human.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Merge a non-major bump whose gate went green
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::error::gate passed but the merge did not land after 3 attempts"
            exit 1
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
